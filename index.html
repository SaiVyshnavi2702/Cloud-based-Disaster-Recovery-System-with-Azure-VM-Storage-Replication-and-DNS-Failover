{% extends 'base.html' %}

{% block content %}

<h2>DNS Failover Test Page</h2>

<p>{{ data }}</p>
<p>{{ regdata }}</p>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Name"><br><br>
    <input type="email" name="email" placeholder="Email"><br><br>
    <input type="text" name="college" placeholder="College"><br><br>
    <input type="text" name="no" placeholder="Contact"><br><br>
    <input type="text" name="loc" placeholder="Location"><br><br>

    <button type="submit">Submit</button>
</form>

{% endblock %}
